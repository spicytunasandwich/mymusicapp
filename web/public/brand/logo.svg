<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="linearLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Linear Soundwave Bars -->
  <rect x="14" y="38" width="8" height="24" rx="4" fill="url(#linearLogoGrad)" opacity="0.75" />
  <rect x="28" y="24" width="8" height="52" rx="4" fill="url(#linearLogoGrad)" opacity="0.9" />
  <rect x="42" y="12" width="8" height="76" rx="4" fill="url(#linearLogoGrad)" filter="url(#glow)" />
  <rect x="56" y="28" width="8" height="44" rx="4" fill="url(#linearLogoGrad)" opacity="0.95" />
  <rect x="70" y="20" width="8" height="60" rx="4" fill="url(#linearLogoGrad)" opacity="0.9" />
  <rect x="84" y="42" width="8" height="16" rx="4" fill="url(#linearLogoGrad)" opacity="0.75" />
</svg>